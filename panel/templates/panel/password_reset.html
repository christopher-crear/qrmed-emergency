{% load static %}
<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nueva contraseña · QRMed</title><link rel="stylesheet" href="{% static 'panel/css/app.css' %}"></head>
<body class="login-body login-shared"><section class="login-panel"><form class="login-card" id="resetForm">{% csrf_token %}
  <h2>Crear nueva contraseña</h2><p class="muted">Utiliza al menos 8 caracteres.</p><div class="alert error" id="resetError" hidden></div>
  <label>Nueva contraseña</label><div class="input-icon"><i data-lucide="key-round"></i><input type="password" name="password" minlength="8" required autocomplete="new-password"><button type="button" data-toggle-password aria-label="Mostrar contraseña"><i data-lucide="eye"></i></button></div>
  <label>Confirmar contraseña</label><div class="input-icon"><i data-lucide="key-round"></i><input type="password" name="confirmation" minlength="8" required autocomplete="new-password"><button type="button" data-toggle-password aria-label="Mostrar contraseña"><i data-lucide="eye"></i></button></div>
  <button class="btn btn-primary btn-large" type="submit">Guardar nueva contraseña</button><p class="register-login-link"><a href="{% url 'login' %}">Volver al inicio</a></p>
</form></section><section class="login-visual"><div class="login-copy"><h1>Protege tu cuenta</h1><p>Después del cambio podrás iniciar sesión normalmente.</p></div></section><script src="{% static 'panel/vendor/lucide.min.js' %}"></script><script>
lucide.createIcons(); document.querySelectorAll('[data-toggle-password]').forEach(b=>b.addEventListener('click',()=>{const i=b.parentElement.querySelector('input');i.type=i.type==='password'?'text':'password';}));
const token=new URLSearchParams(location.hash.slice(1)).get('access_token'); const form=document.getElementById('resetForm'); const error=document.getElementById('resetError');
if(!token){error.hidden=false;error.textContent='El enlace es inválido o expiró. Solicita uno nuevo.';form.querySelector('button[type=submit]').disabled=true;}
form.addEventListener('submit',async event=>{event.preventDefault();error.hidden=true;const body={access_token:token,password:form.password.value,confirmation:form.confirmation.value};const response=await fetch('{% url "password_reset_complete" %}',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':form.querySelector('[name=csrfmiddlewaretoken]').value},body:JSON.stringify(body)});const data=await response.json();if(data.ok)location.href=data.redirect;else{error.hidden=false;error.textContent=data.error||'No se pudo cambiar la contraseña.';}});
</script></body></html>
