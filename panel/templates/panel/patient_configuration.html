{% extends 'panel/user_base.html' %}{% block title %}Configuración{% endblock %}{% block content %}<div class="patient-page user-settings-page"><header class="patient-page-heading"><div><h1>Configuración</h1><p>Administra tus preferencias</p></div></header><form method="post">{% csrf_token %}<section class="patient-card user-settings-card"><h2><i data-lucide="globe-2"></i> Apariencia e idioma</h2><div class="settings-selects"><label>Idioma<select name="language"><option value="es" {% if preferences.language != 'en' %}selected{% endif %}>🇪🇨 Español</option><option value="en" {% if preferences.language == 'en' %}selected{% endif %}>🇺🇸 English</option></select></label><label>Tema<select name="theme"><option value="light" {% if preferences.theme != 'dark' %}selected{% endif %}>☀️ Claro</option><option value="dark" {% if preferences.theme == 'dark' %}selected{% endif %}>🌙 Oscuro</option></select></label></div></section><section class="patient-card user-settings-card"><h2><i data-lucide="bell"></i> Notificaciones</h2><div class="user-switches"><label><span><strong>Actualizaciones de pedidos</strong><small>Recibe alertas cuando tu pulsera cambie de estado</small></span><input type="checkbox" name="order_updates" {% if preferences.order_updates %}checked{% endif %}><i></i></label><label><span><strong>Actividad de QR</strong><small>Notificación cuando tu QR es escaneado</small></span><input type="checkbox" name="qr_activity" {% if preferences.qr_activity %}checked{% endif %}><i></i></label><label><span><strong>Boletín por email</strong><small>Novedades y consejos de salud</small></span><input type="checkbox" name="email_news" {% if preferences.email_news %}checked{% endif %}><i></i></label><label><span><strong>Alertas del sistema</strong><small>Mantenimiento y actualizaciones</small></span><input type="checkbox" name="system_alerts" {% if preferences.system_alerts %}checked{% endif %}><i></i></label></div></section><section class="patient-card user-settings-card"><h2><i data-lucide="lock"></i> Privacidad</h2><div class="user-switches"><label><span><strong>Ficha pública activa</strong><small>Permitir que cualquier persona vea tu ficha al escanear el QR</small></span><input type="checkbox" name="public_profile" {% if preferences.public_profile %}checked{% endif %}><i></i></label><label><span><strong>Análisis de uso</strong><small>Compartir datos anónimos para mejorar la plataforma</small></span><input type="checkbox" name="analytics" {% if preferences.analytics %}checked{% endif %}><i></i></label></div></section><button class="btn btn-primary settings-save"><i data-lucide="check"></i> Guardar configuración</button></form></div>{% endblock %}
